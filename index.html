lan","Nixon and Mao",2007,"История дипломатии"],["Tony Judt","Postwar",2005,"История дипломатии"],["Eric Hobsbawm","Age of Extremes",1994,"История дипломатии"],["Kishore Mahbubani","The Great Convergence",2013,"Геополитика и стратегия"],["Fareed Zakaria","The Post-American World",2008,"Геополитика и стратегия"],["David Shambaugh","China Goes Global",2013,"Китай и Восточная Азия"],["Andrew J. Nathan, Andrew Scobell","China's Search for Security",2012,"Китай и Восточная Азия"],["Evan S. Medeiros","China's International Behavior",2006,"Китай и Восточная Азия"],["Angela Stent","Putin's World",2019,"Россия и постсоветское пространство"],["Michael McFaul","From Cold War to Hot Peace",2018,"Россия и постсоветское пространство"],["Stephen Kotkin","Armageddon Averted",2001,"Россия и постсоветское пространство"],["Serhii Plokhy","The Gates of Europe",2015,"Россия и постсоветское пространство"],["Christine Gray","International Law and the Use of Force",2008,"Международное право"],["Yoram Dinstein","War, Aggression and Self-Defence",2011,"Международное право"],["Thomas G. Weiss","What's Wrong with the United Nations",2008,"Международные организации"],["Kishore Mahbubani","Has the West Lost It?",2018,"Геополитика и стратегия"],["Sun Tzu","The Art of War",5,"Геополитика и стратегия"],["Kautilya","The Arthashastra",3,"Геополитика и стратегия"],["Thucydides","History of the Peloponnesian War",431,"История дипломатии"],["Alexis de Tocqueville","Democracy in America",1835,"Политическая теория"],["Max Weber","Economy and Society",1922,"Политическая теория"],["Robert Dahl","Polyarchy",1971,"Политическая теория"],["John Rawls","A Theory of Justice",1971,"Политическая теория"],["Raymond Aron","Peace and War",1962,"Теория международных отношений"],["Martin Wight","International Theory: The Three Traditions",1991,"Теория международных отношений"],["Andrew Hurrell","On Global Order",2007,"Теория международных отношений"],["Robert Cox","Production, Power, and World Order",1987,"Теория междун function list(){let s=search.value.toLowerCase(),c=cat.value,l=level.value,r=region.value;return books.filter(b=>(!s||(b.title+" "+b.author).toLowerCase().includes(s))&&(!c||b.category===c)&&(!l||b.level===l)&&(!r||b.region===r)&&(mode==="all"||mode==="library"&&favs.has(b.id)||mode==="diplomat"&&b.ratings.diplomacy>=4||mode==="research"&&b.ratings.research>=5||mode==="strategy"&&b.ratings.strategy>=5))}
function render(){let a=list();stats.textContent=`Всего источников: ${books.length} · Показано: ${a.length} · Прочитано: ${read.size} · В библиотеке: ${favs.size}`;grid.innerHTML=a.map(b=>`<article class=card><div class=meta>${b.category} · ${b.year}</div><h3>${b.title}</h3><div class=author>${b.author}</div><div class=meta>${b.type} · ${b.region} · ${b.level}</div><div class=desc>${b.description}</div><div><button onclick="openBook(${b.id})">Подробнее</button> <button onclick="fav(${b.id})">${favs.has(b.id)?"★":"☆"}</button> <button onclick="mark(${b.id})">${read.has(b.id)?"✓":"○"}</button></div></article>`).join("")}
function openBook(id){let b=books.find(x=>x.id===id);modal.innerHTML=`<h2>${b.title}</h2><p class=author>${b.author}</p><p>${b.description}</p><h3>Для дипломата</h3><p>${b.whyDiplomat}</p><h3>Для исследователя</h3><p>${b.whyResearch}</p><p>${b.themes.map(t=>`<span class=tag>${t}</span>`).join("")}</p>`;dlg.showModal()}
function save(){localStorage.setItem("favs",JSON.stringify([...favs]));localStorage.setItem("read",JSON.stringify([...read]))}
function fav(id){favs.has(id)?favs.delete(id):favs.add(id);save();render()}function mark(id){read.has(id)?read.delete(id):read.add(id);save();render()}

["search","cat","level","region"].forEach(id=>$(id).oninput=render);
